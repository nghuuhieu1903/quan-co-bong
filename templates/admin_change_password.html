{% extends "admin_base.html" %}

{% block title %}Đổi mật khẩu - Cô Bông Cát Lái{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card fade-in" style="max-width: 420px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: var(--gradient-primary); width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
                <i class="fas fa-key" style="font-size: 1.75rem; color: white;"></i>
            </div>
            <h2 style="margin: 0; color: var(--text-primary); font-size: 1.5rem;">Đổi mật khẩu</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Tài khoản: {{ session.admin_username }}</p>
        </div>

        <form method="POST" action="{{ url_for('admin_change_password_submit') }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Mật khẩu hiện tại</label>
                <input type="password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-key"></i> Mật khẩu mới</label>
                <input type="password" name="new_password" class="form-control" minlength="6" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-key"></i> Xác nhận mật khẩu mới</label>
                <input type="password" name="confirm_password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
                <i class="fas fa-save"></i> Cập nhật mật khẩu
            </button>
        </form>
    </div>
</div>
{% endblock %}
