{% extends "modern_base.html" %}

{% block title %}Admin Login - Cô Bông Cát Lái{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px); margin: -2rem;">
    <div class="card fade-in" style="max-width: 400px; width: 100%; margin: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: var(--gradient-primary); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fas fa-user-shield" style="font-size: 2rem; color: white;"></i>
            </div>
            <h2 style="margin: 0; color: var(--text-primary); font-size: 1.8rem;">Admin Login</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Đăng nhập vào trang quản trị</p>
        </div>
        
        <form method="POST" action="{{ url_for('admin_authenticate') }}">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Tên đăng nhập
                </label>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-lock"></i> Mật khẩu
                </label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </button>
        </form>
        
        <div style="margin-top: 1rem; text-align: center;">
            <a href="{{ url_for('admin_forgot_password') }}" style="color: var(--text-secondary); font-size: 0.9rem;">
                Quên mật khẩu?
            </a>
        </div>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{{ url_for('customer_login') }}" class="btn btn-outline" style="width: 100%;">
                <i class="fas fa-user"></i> Đăng nhập khách hàng
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const fadeElements = document.querySelectorAll('.fade-in');
    fadeElements.forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(20px)';
        el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
        
        setTimeout(() => {
            el.style.opacity = '1';
            el.style.transform = 'translateY(0)';
        }, 100);
    });
});
</script>
{% endblock %}
