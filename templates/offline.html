<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ seo_shop.site_name }} - Mất kết nối</title>
<style>
    :root { color-scheme: light dark; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f8fc;
        color: #1e293b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0f1720; color: #e2e8f0; }
    }
    .box { max-width: 360px; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.6rem; }
    p { margin: 0 0 1.5rem; color: #64748b; line-height: 1.6; }
    a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #2F9BFF;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>Không có kết nối mạng</h1>
        <p>{{ seo_shop.site_name }} cần Internet để hiển thị menu và giá mới nhất.
           Kiểm tra lại mạng rồi thử lại.</p>
        <a href="/">Thử lại</a>
    </div>
</body>
</html>
