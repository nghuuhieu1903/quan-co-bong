{% extends "modern_base.html" %}

{% block title %}Đặt lại mật khẩu - Cô Bông Cát Lái{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px); margin: -2rem;">
    <div class="card fade-in" style="max-width: 420px; width: 100%; margin: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="background: var(--gradient-primary); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                <i class="fas fa-shield-alt" style="font-size: 2rem; color: white;"></i>
            </div>
            <h2 style="margin: 0; color: var(--text-primary); font-size: 1.5rem;">Đặt lại mật khẩu</h2>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Nhập mã xác nhận đã gửi qua email và mật khẩu mới.</p>
        </div>

        <form method="POST" action="{{ url_for('admin_reset_password_submit') }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" value="{{ username }}" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-key"></i> Mã xác nhận (6 số)</label>
                <input type="text" name="code" class="form-control" maxlength="6" inputmode="numeric" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Mật khẩu mới</label>
                <input type="password" name="new_password" class="form-control" minlength="6" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Xác nhận mật khẩu mới</label>
                <input type="password" name="confirm_password" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
                <i class="fas fa-check"></i> Đặt lại mật khẩu
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{{ url_for('admin_login') }}" style="color: var(--text-secondary); font-size: 0.9rem;">
                <i class="fas fa-arrow-left"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
{% endblock %}
